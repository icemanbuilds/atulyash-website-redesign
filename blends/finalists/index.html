<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Finalists | Atulyash</title>
<style>
:root {
  color-scheme: light;
  --ink: #191e17;
  --muted: #50594e;
  --line: #dce2d8;
  --paper: #f4f6f1;
  --green: #365e12;
  --yellow: #ffcf39;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 76px; }
body { margin: 0; background: #fff; color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
.shell { width: min(100% - 32px, 1240px); margin-inline: auto; }
.top { position: sticky; z-index: 2; top: 0; background: #fff; border-bottom: 1px solid var(--line); }
.top nav { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding: 5px 4px; }
.top a { flex: none; white-space: nowrap; padding-inline: 12px; text-decoration: none; }
.top a:hover, .top a[aria-current] { background: var(--paper); }
.top a[aria-current] { box-shadow: inset 0 -2px var(--green); }
a { color: var(--green); text-underline-offset: .2em; }
a:hover { text-decoration-thickness: 2px; }
a, button, select { -webkit-tap-highlight-color: #ffcf3966; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.action { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; }
.intro { padding-block: clamp(26px, 5vw, 56px) 24px; }
h1, h2, h3, p, figure { margin: 0; }
h1 { font-size: clamp(30px, 4vw, 46px); line-height: 1.08; letter-spacing: -.035em; }
h2 { font-size: clamp(23px, 2.4vw, 30px); line-height: 1.18; letter-spacing: -.02em; }
h3 { font-size: 17px; line-height: 1.3; }
p { color: var(--muted); }
.intro p { margin-top: 10px; max-width: 60ch; }
main { padding-bottom: 48px; }
.group-title { display: flex; align-items: center; gap: 10px; }
.badge {
  flex: none; display: grid; place-items: center; min-height: 32px; padding-inline: 10px;
  border-radius: 999px; background: var(--yellow); color: var(--ink); font-size: 13px; font-weight: 750;
}
.caption { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.caption p { font-size: 14px; margin-top: 3px; }
.open {
  flex: none; border: 1px solid var(--line); border-radius: 8px; padding-inline: 10px;
  background: #fff; font-size: 14px; font-weight: 650; text-decoration: none;
}
.open:hover { border-color: var(--green); background: var(--paper); }
.viewport { container-type: inline-size; width: 100%; overflow: hidden; background: var(--paper); }
.viewport iframe {
  display: block; border: 0; width: var(--frame-width, 390px); height: var(--frame-height, 844px);
  zoom: min(1, calc(100cqw / var(--frame-width, 390px)));
}
@media (max-width: 480px) {
  .top nav { gap: 2px; }
  .top a { padding-inline: 7px; font-size: 14px; }
}
@media (min-width: 740px) {
  .shell { width: min(100% - 80px, 1240px); }
}
.design + .design { margin-top: 38px; }
.design {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: 16px; padding: 12px;
}
.design > header p { margin-top: 7px; max-width: 32ch; }
.phones { display: grid; gap: 22px; min-width: 0; }
.design .phones { margin-top: 14px; }
.phones figure { width: 100%; max-width: 390px; min-width: 0; }
.phones .caption { margin-bottom: 8px; }
.phones .viewport { border-radius: 16px; background: #244123; }
@media (min-width: 680px) {
  .phones { grid-template-columns: repeat(2, minmax(0, 390px)); gap: 24px; }
  .design { padding: 18px; }
}
@media (min-width: 1080px) {
  .design { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 3fr); gap: 20px; padding: 24px; }
  .design .phones { margin-top: 0; }
  .sources .phones { grid-template-columns: repeat(3, minmax(0, 390px)); }
}
</style>
</head>
<body>
<header class="top">
  <nav class="shell" aria-label="Collection">
    <a class="action" href="../">&#8592; Overview</a>
    <a class="action" href="#design-1">Design 1</a>
    <a class="action" href="#design-2">Design 2</a>
  </nav>
</header>
<main class="shell">
  <div class="intro">
    <h1>Finalists</h1>
    <p>Two designs, two alternates each. Scroll inside a preview to see the full page.</p>
  </div>
  <section class="design" aria-labelledby="design-1">
      <header><div class="group-title"><span class="badge">Design 1</span><h2 id="design-1">Glass lens</h2></div><p>Fluted glass strips over the wheat, with a round clear lens onto the kitchen.</p></header>
      <div class="phones">
        <figure>
          <figcaption class="caption">
            <div><h3>Alt 1A</h3><p>White headlines</p></div>
            <a class="action open" href="1a/" aria-label="Open Alt 1A">Open</a>
          </figcaption>
          <div class="viewport"><iframe src="1a/index.html" title="Alt 1A live preview" loading="lazy"></iframe></div>
        </figure>
        <figure>
          <figcaption class="caption">
            <div><h3>Alt 1B</h3><p>Yellow headlines</p></div>
            <a class="action open" href="1b/" aria-label="Open Alt 1B">Open</a>
          </figcaption>
          <div class="viewport"><iframe src="1b/index.html" title="Alt 1B live preview" loading="lazy"></iframe></div>
        </figure>
      </div>
    </section>
    <section class="design" aria-labelledby="design-2">
      <header><div class="group-title"><span class="badge">Design 2</span><h2 id="design-2">Sunlit panels</h2></div><p>Yellow and white panels over wheat.</p></header>
      <div class="phones">
        <figure>
          <figcaption class="caption">
            <div><h3>Alt 2A</h3><p>Cream and yellow, wheat through windows</p></div>
            <a class="action open" href="2a/" aria-label="Open Alt 2A">Open</a>
          </figcaption>
          <div class="viewport"><iframe src="2a/index.html" title="Alt 2A live preview" loading="lazy"></iframe></div>
        </figure>
        <figure>
          <figcaption class="caption">
            <div><h3>Alt 2B</h3><p>Yellow and white, abstract shapes</p></div>
            <a class="action open" href="2b/" aria-label="Open Alt 2B">Open</a>
          </figcaption>
          <div class="viewport"><iframe src="2b/index.html" title="Alt 2B live preview" loading="lazy"></iframe></div>
        </figure>
      </div>
    </section>
</main>
</body>
</html>
