<!doctype html>
<html lang="en">
<head>

<title>2A and its sources | Atulyash</title>
<style>
:root {
  color-scheme: light;
  --ink: #191e17;
  --muted: #50594e;
  --line: #dce2d8;
  --paper: #f4f6f1;
  --green: #365e12;
  --yellow: #ffcf39;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 76px; }
body { margin: 0; background: #fff; color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
.shell { width: min(100% - 32px, 1240px); margin-inline: auto; }
.top { position: sticky; z-index: 2; top: 0; background: #fff; border-bottom: 1px solid var(--line); }
.top nav { display: flex; align-items: center; gap: 4px; overflow-x: auto; padding: 5px 4px; }
.top a { flex: none; white-space: nowrap; padding-inline: 12px; text-decoration: none; }
.top a:hover, .top a[aria-current] { background: var(--paper); }
.top a[aria-current] { box-shadow: inset 0 -2px var(--green); }
a { color: var(--green); text-underline-offset: .2em; }
a:hover { text-decoration-thickness: 2px; }
a, button, select { -webkit-tap-highlight-color: #ffcf3966; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.action { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; }
.intro { padding-block: clamp(26px, 5vw, 56px) 24px; }
h1, h2, h3, p, figure { margin: 0; }
h1 { font-size: clamp(30px, 4vw, 46px); line-height: 1.08; letter-spacing: -.035em; }
h2 { font-size: clamp(23px, 2.4vw, 30px); line-height: 1.18; letter-spacing: -.02em; }
h3 { font-size: 17px; line-height: 1.3; }
p { color: var(--muted); }
.intro p { margin-top: 10px; max-width: 60ch; }
main { padding-bottom: 48px; }
.caption { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.caption p { font-size: 14px; margin-top: 3px; }
.open {
  flex: none; border: 1px solid var(--line); border-radius: 8px; padding-inline: 10px;
  background: #fff; font-size: 14px; font-weight: 650; text-decoration: none;
}
.open:hover { border-color: var(--green); background: var(--paper); }
.viewport { container-type: inline-size; width: 100%; overflow: hidden; background: var(--paper); }
.viewport iframe {
  display: block; border: 0; width: var(--frame-width, 390px); height: var(--frame-height, 844px);
  zoom: min(1, calc(100cqw / var(--frame-width, 390px)));
}
@media (max-width: 480px) {
  .top nav { gap: 2px; }
  .top a { padding-inline: 7px; font-size: 14px; }
}
@media (min-width: 740px) {
  .shell { width: min(100% - 80px, 1240px); }
}
.phones { display: grid; gap: 22px; min-width: 0; }
.phones figure { width: 100%; max-width: 390px; min-width: 0; }
.phones .caption { margin-bottom: 8px; }
.phones .viewport { border-radius: 16px; background: #244123; }
@media (min-width: 680px) {
  .phones { grid-template-columns: repeat(2, minmax(0, 390px)); gap: 24px; }
}
@media (min-width: 1080px) {
  .sources .phones { grid-template-columns: repeat(3, minmax(0, 390px)); }
}
</style>
</head>
<body>

      </figcaption>
      <div class="viewport"><iframe src="../../opening/9-glass-field/index.html" title="3 Glass Field live preview" loading="lazy"></iframe></div>
    </figure>
    <figure>
      <figcaption class="caption">
        <div><h2>2A Sunlit panels</h2><p>Current blend</p></div>
        <a class="action open" href="../finalists/2a/" aria-label="Open 2A Sunlit panels">Open</a>
      </figcaption>
      <div class="viewport"><iframe src="../finalists/2a/" title="2A Sunlit panels live preview" loading="lazy"></iframe></div>
    </figure>
  </div>
</main>
</body>
</html>
